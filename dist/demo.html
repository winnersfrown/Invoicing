<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sorikano — Invoice workspace</title>
  <meta name="description" content="Review invoices and purchase orders in your private Sorikano workspace.">
  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg">
  <link rel="stylesheet" href="brand-mark.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true"></span>Sorikano</a>
  </aside>
  <main>
    <header>
      <span>Invoice workspace</span>
      <div id="auth-area" class="auth-area"></div>
    </header>
    <div class="content">
      <section id="account-gateway" class="page-heading" aria-labelledby="gateway-title">
        <div>
          <h1 id="gateway-title">Try Sorikano</h1>
          <p>Sign up or log in to review sample invoices and purchase orders in your private demo workspace.</p>
        </div>
      </section>
      <section id="invoices-page" aria-label="Invoice workspace" hidden></section>
    </div>
  </main>
  <script type="module" src="auth-ui.js"></script>
</body>
</html>
